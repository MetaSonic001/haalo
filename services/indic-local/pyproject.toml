[project]
name = "haalo-indic-local"
version = "0.1.0"
description = "Optional self-hosted Indic speech server (free, no Docker): AI4Bharat IndicConformer STT. Matches the indic_local provider contract."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "torch>=2.4",
  "torchaudio>=2.4",
  "transformers>=4.44",
  "onnxruntime==1.20.1",
  "onnx==1.20.1",
  "soundfile>=0.12",
  "numpy",
  "python-dotenv",
]
