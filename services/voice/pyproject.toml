[project]
name = "haalo-voice"
version = "0.1.0"
description = "Haalo voice agent: Pipecat pipeline, scheduler worker, post-call jobs, FastAPI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pipecat-ai[webrtc,websocket,groq,sarvam,runner]==1.12.0",
  "fastapi==0.142.1",
  "uvicorn[standard]==0.54.0",
  "groq==1.7.0",
  "twilio==9.11.2",
  "supabase==2.31.0",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "apscheduler==3.11.3",
  "edge-tts>=7.0",
  "miniaudio>=1.71",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=0.24", "ruff==0.16.9"]

[project.scripts]
haalo-voice = "haalo_voice.server:run"
haalo-models = "haalo_voice.cli:models"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haalo_voice"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
